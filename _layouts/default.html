<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta property="og:title" content="{{ page.title }} | Trinh Huu Tho" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:type" content="article" />
  <meta property="article:published_time" content="{{ page.date | date: '%Y-%m-%d' }}" />
  <meta property="article:author" content="Trinh Huu Tho" />
  <title>{{ page.title }} | Trinh Huu Tho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="alternate" type="application/rss+xml" title="Trinh Huu Tho Blog" href="/feed.xml" />
  <link rel="stylesheet" href="/assets/vendor/highlight/github-dark.min.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">THT</a>
      <ul class="nav-menu" id="navMenu">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/about.html" class="nav-link">About</a></li>
        <li><a href="/projects.html" class="nav-link">Projects</a></li>
        <li><a href="/blog/" class="nav-link active">Blog</a></li>
        <li><a href="/guestbook.html" class="nav-link">Guestbook</a></li>
        <li><a href="/contact.html" class="nav-link">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
        <button class="hamburger" id="hamburger" aria-label="Toggle mobile menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  {{ content }}

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0; justify-content: center;">
        <span>© 2025 Trinh Huu Tho. Built with ❤️ and Jekyll.</span>
      </div>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>
  <script src="/js/main.js"></script>
  <script src="/assets/vendor/highlight/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>

</html>
